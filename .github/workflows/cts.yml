name: cts

on:
  push:
    paths: ['plugins/cts/**', '.github/workflows/cts.yml']
  pull_request:
    paths: ['plugins/cts/**', '.github/workflows/cts.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x', '24.x']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/cts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No npm install: CTS has no dependencies. Chrome is preinstalled on the hosted runners, so PNG card tests run;
      # ffmpeg is not, so the gif/mp4 replay test skips that part.
      - run: npm test
      # Spec budgets on the largest fixture. Hosted runners are slower than a laptop, so time budgets get 2x slack.
      - run: node scripts/bench.mjs 100000 --assert
        env:
          CTS_BENCH_SLACK: '2'
